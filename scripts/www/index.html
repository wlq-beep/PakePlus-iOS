tle:`一节电池的小危险`,tag:`安全提示`,story:`小小一节电池，如果被挤压、破损或乱丢，里面的物质可能污染土壤和水。`,tip:`废电池、充电宝、过期药品要单独放到有害垃圾收集点。`},{title:`瓶子的旅行`,tag:`回收故事`,story:`一个空塑料瓶被正确回收后，可能被重新加工成纤维、包装材料或新的塑料制品。`,tip:`饮料瓶要倒空、简单沥干，有条件可以压扁后投放。`},{title:`大骨头为什么不是湿垃圾`,tag:`易错故事`,story:`湿垃圾的重点是容易腐烂。大骨头太硬，处理设备难以粉碎，所以通常要进干垃圾。`,tip:`大骨头、贝壳、榴莲壳这类硬壳硬骨，先查清楚再投放。`},{title:`旧衣服的去处`,tag:`分类故事`,story:`干净旧衣物可以进入回收渠道，有的会再利用，有的会被加工成再生材料。`,tip:`旧衣服要保持干净干燥，严重油污或发霉的衣物不要混入回收箱。`},{title:`为什么要把纸箱压平`,tag:`趣味科普`,story:`纸箱压平后占用空间更小，运输一次能装下更多纸类，也能减少回收过程中的空跑。`,tip:`快递箱先取出胶带和填充物，压平后再投入可回收物。`},{title:`湿垃圾为什么要沥干`,tag:`分类技巧`,story:`湿垃圾里的汤水太多，容易产生异味，也会增加运输和处理难度。沥干一步很小，但很有用。`,tip:`剩饭剩菜先倒掉汤水，塑料袋不要一起扔进湿垃圾桶。`},{title:`玻璃不是都能随便扔`,tag:`安全提示`,story:`完整玻璃瓶可以回收，但碎玻璃很容易划伤人，投放前需要包好再处理。`,tip:`碎玻璃、碎陶瓷先用厚纸包裹，写上“尖锐物”更安全。`},{title:`一张纸巾的误会`,tag:`易错科普`,story:`很多人以为纸巾是纸就能回收，但用过的纸巾纤维短、容易被污染，通常不适合回收。`,tip:`用过的纸巾、湿巾、厨房纸一般投入干垃圾。`},{title:`包装要不要拆开`,tag:`分类方法`,story:`很多垃圾不是一个整体答案。比如食品和包装袋要分开，内容物和外包装可能属于不同类别。`,tip:`过期面包去掉包装，面包进湿垃圾，包装袋和干燥剂进干垃圾。`},{title:`回收标志不等于一定回收`,tag:`趣味科普`,story:`包装上有回收标志，说明材料可能可回收；但如果被油污、残渣严重污染，回收价值会下降。`,tip:`可回收物尽量保持干净、干燥、倒空，油污严重的餐盒先按干垃圾处理。`},{title:`有害垃圾要慢一点扔`,tag:`安全故事`,story:`有害垃圾不追求快，追求安全。电池、灯管、药品这类物品需要保持完整，交给专门容器处理。`,tip:`灯管不要敲碎，药品保留包装，充电电池电极贴胶带防短路。`}],oe=[{id:`sh-hp-1`,city:`上海`,district:`黄浦区`,name:`人民广场分类投放点`,address:`南京西路近人民公园3号门`,distance:.4,accepts:[`可回收物`,`有害垃圾`,`湿垃圾`,`干垃圾`],hours:`06:30-21:30`,note:`有害垃圾箱在管理亭右侧`},{id:`sh-xh-1`,city:`上海`,district:`徐汇区`,name:`徐家汇生活垃圾驿站`,address:`漕溪北路近南丹路`,distance:1.2,accepts:[`可回收物`,`湿垃圾`,`干垃圾`],hours:`07:00-20:00`,note:`大件纸箱可压平后投放`},{id:`sh-pd-1`,city:`上海`,district:`浦东新区`,name:`世纪公园北门回收点`,address:`锦绣路1001号附近`,distance:2.6,accepts:[`可回收物`,`有害垃圾`],hours:`08:00-19:00`,note:`适合投放电池、灯管、旧衣物`},{id:`sh-ja-1`,city:`上海`,district:`静安区`,name:`静安寺社区分类站`,address:`愚园路近常德路`,distance:3.1,accepts:[`可回收物`,`有害垃圾`,`干垃圾`],hours:`07:30-20:30`,note:`药品请保持原包装`},{id:`bj-dc-1`,city:`北京`,district:`东城区`,name:`王府井分类投放站`,address:`王府井大街步行街北口`,distance:.8,accepts:[`可回收物`,`有害垃圾`,`湿垃圾`,`干垃圾`],hours:`06:00-22:00`,note:`厨余垃圾需要破袋投放`},
